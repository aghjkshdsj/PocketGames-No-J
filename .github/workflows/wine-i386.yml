name: Stage 2b - Wine i386 farm (WoW64)

# 32-bit games (docs/INTERPRETERS.md, stage 1): Wine's i386 DLLs, DXMT's i386 D3D DLLs and
# DanPort's hello-x86.exe (engine/wine/build-i386.sh). build-ipa.yml bundles the newest successful
# set as i386-windows (C:\windows\syswow64 in a session). Runs when the build script or a pin
# changes; the artifact is kept for build-ipa.yml.
on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read
  actions: read

concurrency:
  group: wine-i386-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i386-farm:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Host tools
        run: |
          brew install bison flex meson ninja || true
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain > /dev/null 2>&1 || true
          sysctl -n hw.ncpu

      # The Wine stage's checkout (DanPort, its Wine fork, llvm-mingw) as a head start; nothing
      # is saved back (the i386 tree is large and rebuilt only when a pin changes).
      - name: Restore checkout
        uses: actions/cache/restore@v4
        with:
          path: engine/wine/danport
          key: wine-i386-${{ hashFiles('engine/wine/PIN', 'engine/dxmt/PIN') }}-none
          restore-keys: |
            dxmt-pe-${{ hashFiles('engine/wine/PIN', 'engine/dxmt/PIN') }}-v1-
            wine-unix-${{ hashFiles('engine/wine/PIN') }}-v1-

      - name: Fetch DanPort, Wine fork, DXMT
        run: bash engine/wine/build-i386.sh fetch

      - name: Wine i386 modules
        run: bash engine/wine/build-i386.sh wine

      - name: DXMT i386 (d3d11, dxgi, d3d10core, winemetal, d3d9 shim + frontend)
        run: bash engine/wine/build-i386.sh dxmt

      - name: hello-x86.exe
        run: bash engine/wine/build-i386.sh extras

      # The WoW64 host side's wow64win.dll (aarch64) with atoms and resource IDs kept
      # (engine/wine/patches/wow64win_atoms.py); build-ipa.yml puts it over DanPort's copy.
      - name: wow64win.dll (aarch64, atoms kept)
        run: |
          set -o pipefail
          bash engine/wine/build-i386.sh a64 2>&1 | tee a64.log
          grep -E '^== ' a64.log | sed 's/^== /- /; s/ ==$//' >> "$GITHUB_STEP_SUMMARY"

      # Fails on a missing import: a 32-bit program that imports one missing DLL never starts.
      - name: Collect and check imports
        run: |
          set -o pipefail
          bash engine/wine/build-i386.sh collect 2>&1 | tee collect.log
          {
            echo "## Wine i386 farm (WoW64)"
            echo "- Wine $(git -C engine/wine/danport/wine rev-parse --short HEAD), DXMT $(git -C engine/wine/danport/dxmt rev-parse --short HEAD)"
            grep -E '^== ' collect.log | sed 's/^== /- /; s/ ==$//'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: wine-i386-farm
          path: engine/wine/out-i386/i386-windows
          retention-days: 90

      - uses: actions/upload-artifact@v5
        with:
          name: wine-a64-overrides
          path: engine/wine/out-i386/aarch64-windows
          retention-days: 90

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wine-i386-logs
          path: |
            engine/wine/danport/wine/build-i386/*.log
            engine/wine/danport/wine/build-a64/*.log
            engine/wine/danport/dxmt/build-pe-i386-v1/meson-logs/*.txt
          if-no-files-found: ignore
