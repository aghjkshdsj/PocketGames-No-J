name: Stage 3 - DXMT (Direct3D on Metal)

# Builds DXMT's iOS side (D3D9/10/11 -> Metal, shader converter on LLVM 15)
# as libdxmt_combined.a. LLVM is cached, so only the first run is long.
on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read
  actions: write

concurrency:
  group: dxmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dxmt:
    runs-on: macos-26
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: Host tools
        run: brew install ninja meson || true

      - name: Restore DanPort, DXMT and LLVM build
        uses: actions/cache/restore@v4
        with:
          path: engine/dxmt/danport
          key: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-${{ github.run_id }}
          restore-keys: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-

      - name: Fetch DanPort + DXMT + LLVM 15 sources
        run: bash engine/dxmt/build-unix.sh fetch

      - name: LLVM 15 for iOS
        id: llvm
        timeout-minutes: 300
        run: bash engine/dxmt/build-unix.sh llvm

      - name: Metal toolchain
        id: metal
        run: bash engine/dxmt/build-unix.sh metal

      - name: DXMT iOS side
        id: dxmt
        run: bash engine/dxmt/build-unix.sh dxmt

      - name: D3D12 test program
        run: bash engine/dxmt/build-unix.sh tests

      - name: Collect
        run: bash engine/dxmt/build-unix.sh collect

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/dxmt/danport
          key: dxmt-${{ hashFiles('engine/dxmt/PIN') }}-v1-${{ github.run_id }}

      - name: Record dxmt source revision
        if: success()
        run: python3 tools/artifact_manifest.py write engine/dxmt/out dxmt

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: dxmt-libs
          path: engine/dxmt/out

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dxmt-logs
          path: |
            engine/dxmt/danport/toolchains/llvm-ios-ninja.log
            engine/dxmt/danport/build/dxmt-ios/obj/*.err
          if-no-files-found: ignore

